<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var path = window.location.pathname;
      var search = window.location.search;
      if (path && path.startsWith('/') && !path.startsWith('//') && !path.includes('://')) {
        window.location.replace(
          window.location.origin + '/pocket-budget/?p=' + encodeURIComponent(path + search)
        );
      } else {
        window.location.replace(window.location.origin + '/pocket-budget/');
      }
    })();
  </script>
</head>
<body></body>
</html>
